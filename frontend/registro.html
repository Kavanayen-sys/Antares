<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | SiGeRU</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="fondo-formulario">
    <main class="tarjeta-formulario">
        <a class="marca" href="index.html">SiGeRU</a>
        <p>Sistema de Gestión de Residuos Urbanos</p>

        <h1>Crear una cuenta</h1>
        <form id="form-registro">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" maxlength="50" autocomplete="name" required>

            <label for="telefono">Teléfono</label>
            <input id="telefono" name="telefono" maxlength="20" autocomplete="tel" required>

            <label for="email">Correo</label>
            <input id="email" name="email" type="email" maxlength="100" autocomplete="email" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" minlength="6"
                   autocomplete="new-password" required>

            <label for="repetir-password">Repetir contraseña</label>
            <input id="repetir-password" type="password" minlength="6"
                   autocomplete="new-password" required>

            <button class="boton ancho" type="submit">Registrarse</button>
            <p class="mensaje" id="mensaje-registro" aria-live="polite"></p>
        </form>
        <p class="enlace-formulario">¿Ya tenés cuenta? <a href="login.html">Ingresá</a></p>
    </main>
    <script src="js/api.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
