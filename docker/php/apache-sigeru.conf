# Configuración de VirtualHosts para SiGeRU

# Frontend (puerto 8090)
<VirtualHost *:8090>
    DocumentRoot /var/www/html/frontend
    <Directory /var/www/html/frontend>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# API Usuarios (puerto 8091)
<VirtualHost *:8091>
    DocumentRoot /var/www/html/apis/api-usuarios
    DirectoryIndex index.php
    <Directory /var/www/html/apis/api-usuarios>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

